openapi: 3.1.0
info:
  title: XConnect Zero API
  version: 1.0.0
  description: Central control plane for the independent XConnect-One controlled client and self-hosted XConnect Gateway relay.
servers:
  - url: https://accounts.example.invalid
paths:
  /api/overlay/v1/registrations:
    post:
      summary: Request owner approval for a declared XConnect One identity
      description: >-
        Unauthenticated request that creates no device, peer, credential,
        enrollment session, configuration, route or VPN access. The public key
        is a declaration, not hardware or person attestation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistrationRequest'}
      responses:
        '201':
          description: Pending owner approval; the registration token is returned once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationCreated'}
        '400': {description: Invalid request or unsupported platform}
        '404': {description: Network is unavailable for registration}
        '409': {description: Existing device identity conflicts}
        '429': {description: Per-network pending or durable creation budget reached}
  /api/overlay/v1/registrations/{registrationID}/exchange:
    post:
      summary: Poll or consume an owner-approved One registration
      security: [{RegistrationBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/RegistrationID'}
      responses:
        '200': {description: Single-use existing ExchangeResponse after approval}
        '202':
          description: Still pending owner approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationPending'}
        '401': {description: Invalid or mismatched registration token}
        '409': {description: Rejected, consumed, or stale registration}
        '410': {description: Absolute registration expiry}
  /api/overlay/v1/admin/registrations:
    get:
      summary: List current-owner registration audit summaries
      security: [{UserBearer: []}]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Newest 100 registrations and an optional next cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationPage'}
        '401': {description: Active authenticated user required}
        '403': {description: xconnect.zero.manage permission required}
  /api/overlay/v1/admin/registrations/{registrationID}/approve:
    post:
      summary: Approve a pending registration for the explicitly named owned network
      security: [{UserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/RegistrationID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistrationApproval'}
      responses:
        '200':
          description: Updated registration summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationMutation'}
        '404': {description: Registration or requested network is not currently owned}
        '409': {description: Registration is no longer pending}
        '410': {description: Registration expired}
  /api/overlay/v1/admin/registrations/{registrationID}/reject:
    post:
      summary: Reject a pending registration for a currently owned network
      security: [{UserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/RegistrationID'}
      responses:
        '200':
          description: Updated registration summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistrationMutation'}
        '404': {description: Registration network is not currently owned}
        '409': {description: Registration is no longer pending}
        '410': {description: Registration expired}
  /api/overlay/v1/join-tokens/exchange:
    post:
      summary: Consume a one-use invite and register a One or Gateway device
      description: role defaults to one. Gateway invitations are pre-seeded by a trusted bootstrap process and must use role gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '200': {description: Enrollment session and device credential}
        '401': {description: Invalid, expired, or consumed invitation}
        '403': {description: Invitation role or device constraint mismatch}
        '409': {description: Device or generation conflict}
  /api/overlay/v1/device/session:
    post:
      summary: Mint a short enrollment session
      security: [{DeviceCredential: []}]
      responses:
        '200': {description: Short-lived enrollment session}
        '401': {description: Invalid, expired, or revoked device credential}
  /api/overlay/v1/enrollment/signed-config:
    get:
      summary: Fetch a centrally signed One client configuration
      security: [{EnrollmentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceID'}
        - {$ref: '#/components/parameters/NetworkID'}
      responses:
        '200': {description: Ed25519 signed One configuration}
  /api/overlay/v1/enrollment/signed-config/{generation}/ack:
    post:
      summary: Acknowledge local application of a One configuration
      security: [{EnrollmentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Generation'}
      responses:
        '200': {description: Idempotent acknowledgement}
  /api/overlay/v1/gateway/signed-config:
    get:
      summary: Fetch the centrally signed Gateway relay/service snapshot
      security: [{EnrollmentBearer: []}]
      responses:
        '200': {description: Ed25519 signed Gateway peer and forwarding configuration}
  /api/overlay/v1/enrollment/policy-artifacts/{generation}/{digest}:
    get:
      summary: Fetch the policy artifact referenced by a signed One configuration
      security: [{EnrollmentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Generation'}
        - name: digest
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Canonical policy artifact}
  /api/overlay/v1/signing-keys:
    get:
      summary: Discover the Zero signing key ring for an authenticated account user
      security: [{UserBearer: []}]
      responses:
        '200': {description: Current Ed25519 key ring}
        '304': {description: Matching ETag}
  /api/overlay/v1/signed-config:
    get:
      summary: Fetch a signed One configuration for an authenticated account user
      security: [{UserBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceID'}
        - {$ref: '#/components/parameters/NetworkID'}
      responses:
        '200': {description: Ed25519 signed One configuration}
components:
  parameters:
    DeviceID:
      name: device_id
      in: query
      required: true
      schema: {type: string}
    NetworkID:
      name: network_id
      in: query
      required: false
      schema: {type: string}
    Generation:
      name: generation
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    RegistrationID:
      name: registrationID
      in: path
      required: true
      schema: {type: string}
  securitySchemes:
    EnrollmentBearer:
      type: http
      scheme: bearer
      bearerFormat: xenr
    DeviceCredential:
      type: http
      scheme: XConnect-Device
      bearerFormat: xdc
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RegistrationBearer:
      type: http
      scheme: bearer
      bearerFormat: xrt
  schemas:
    ExchangeRequest:
      type: object
      required: [join_token, device_id, platform, wireguard_public_key]
      additionalProperties: false
      properties:
        join_token: {type: string}
        device_id: {type: string}
        name: {type: string}
        platform: {type: string}
        hostname: {type: string}
        wireguard_public_key: {type: string}
        role: {type: string, enum: [one, gateway], default: one}
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [network_id, device_id, platform, wireguard_public_key]
      properties:
        network_id: {type: string}
        device_id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'}
        name: {type: string, maxLength: 255}
        hostname: {type: string, maxLength: 255}
        platform: {type: string, enum: [linux, darwin, windows]}
        wireguard_public_key: {type: string, description: Base64-encoded 32-byte declared public key}
    RegistrationCreated:
      type: object
      required: [registration_id, registration_token, status, expires_at, interval]
      properties:
        registration_id: {type: string}
        registration_token: {type: string, description: One-time capability; save locally and never log it}
        status: {type: string, const: pending}
        expires_at: {type: string, format: date-time}
        interval: {type: integer, const: 5}
    RegistrationPending:
      type: object
      required: [status, expires_at, interval]
      properties:
        status: {type: string, const: pending}
        expires_at: {type: string, format: date-time}
        interval: {type: integer, const: 5}
    RegistrationSummary:
      type: object
      required: [registration_id, network_id, device_id, name, hostname, platform, status, wireguard_public_key_fingerprint, created_at, expires_at]
      properties:
        registration_id: {type: string}
        network_id: {type: string}
        device_id: {type: string}
        name: {type: string}
        hostname: {type: string}
        platform: {type: string, enum: [linux, darwin, windows]}
        status: {type: string, enum: [pending, approved, rejected, expired, consumed]}
        wireguard_public_key_fingerprint: {type: string, description: SHA-256 hex of decoded 32-byte public key declaration}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        approved_at: {type: string, format: date-time}
        rejected_at: {type: string, format: date-time}
        consumed_at: {type: string, format: date-time}
    RegistrationPage:
      type: object
      required: [registrations, has_more]
      properties:
        registrations:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/RegistrationSummary'}
        has_more: {type: boolean}
        next_cursor: {type: string}
    RegistrationApproval:
      type: object
      additionalProperties: false
      required: [network_id]
      properties:
        network_id: {type: string}
    RegistrationMutation:
      type: object
      required: [registration]
      properties:
        registration: {$ref: '#/components/schemas/RegistrationSummary'}
